name: 发布峡谷补丁志
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['同步拳头版本公告']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: 按文件内容生成缓存版本
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path
          
          index = Path("dist/index.html")
          html = index.read_text(encoding="utf-8")
          for asset in ("atlas.css", "atlas.js"):
              digest = hashlib.sha256(index.with_name(asset).read_bytes()).hexdigest()[:16]
              pattern = rf'((?:href|src)="){re.escape(asset)}(?:\?[^"]*)?"'
              html, count = re.subn(pattern, lambda match: f'{match[1]}{asset}?v={digest}"', html)
              if count != 1:
                  raise ValueError(f"Expected exactly one reference to {asset}, found {count}")
          index.write_text(html, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 等待发布包可被查询
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..8}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages 发布包已上传，但查询接口尚未返回该文件"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
